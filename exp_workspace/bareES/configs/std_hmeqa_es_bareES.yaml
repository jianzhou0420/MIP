# std_hmeqa_es_bareES — one experiment, every (harness, model) seat: task · env · agent · run fully specified (schema: core/config_hint.py); harness=<cc | codex | mini> (this folder's harness/ group) and model=<name> (a row of this folder's models/models.yaml) pick the seat, effort=<vendor word> its reasoning effort, api=<native | fake> its endpoint (this folder's api/ group), all on the command line.
# Nothing here is looked up elsewhere but the harness and the model (harness/ and models/models.yaml beside this file); edit a value and it is a different experiment (copy the file, rename).
# Overrides on the command line still work (python runner.py <this file> harness=cc model=fable-5 effort=max run.episodes=0-9 …).
# was std_hmeqa_cc_fable-5_default_bareES · batch ES (fable-5 only; the other three seats are new here)

defaults:
  - harness: ???  # required: cc | codex | mini — harness/<name>.yaml beside this file
  - models: models  # the models table beside this file, models/models.yaml
  - api: native  # the endpoint: native (the vendor's) | fake (scripted, no model) — api/<name>.yaml beside this file
  - _self_

task_key: hmeqa
env_key: es
harness_key: ${harness.root}  # the chosen harness's run-name word
model: ???  # required: a row of models/models.yaml, one with an entry under the chosen harness
model_key: ${model}  # the chosen model's run-name word
effort: default  # the vendor's word (Claude low|medium|high|max · OpenAI low|medium|high|xhigh); default = nothing sent
prefix: std
suffix: ''
task:
  family: eqa
  dataset: hmeqa
  split: mip100
  episodes: 0-99
  max_turns: 150
  rgb_resolution: 512
  step_budget: 500
  episode_timeout: 2400
  require:
  - data/embodiedscore/datasets/hmeqa/questions_mip100.csv
env:
  _target_: exp_workspace.bareES.mcp.env.EmbodiedScoreEnv
  variant: standard
  python: null  # this interpreter: the simulator wheel is installed in the same env as the runner
  port: 9200
  env_fields:
  - rgb_resolution  # task.rgb_resolution -> configure(rgb_resolution=…) -> body.rgb height / width
  body: {}  # Body overrides on the variant's preset: forward_step_m, turn_deg, tilt_deg, camera_pitch_deg, agent_height_m, rgb: {width, height, hfov_deg, position}, depth: null …
  shapes:
    express: core.shapes.es.EsExpress
    goat: core.shapes.es.EsGoat
    objnav: core.shapes.es.EsObjNav
    eqa: core.shapes.es.EsEqa
    nav: core.shapes.es.EsNav
agent:
  arm:
    _target_: core.arm.Arm
    dir: exp_workspace/bareES
    word: bareES
    prompts: prompts.py
    bare: true
    auto_observe: false
    surface:
      env_prefix: BAREES
      env_map:
        SERVER_URL: server_url
        TASK: es_task
        ACTIONS: es_actions
        STEP_BUDGET: step_budget
        TURN_BUDGET: turn_budget
        BARE: bare
        AUTO_OBSERVE: auto_observe
        LIVE_DIR: live_dir
  harness: ${harness}
  model: ${models[${model}][${harness.root}]}
  api: ${api}
run:
  name: std_hmeqa_es_${harness.root}_${model}_${effort}_bareES
  dir: outputs/${harness.output_dir}/${run.name}
  episodes: 0-99
  servers: null
  wp_server: null
  resume: false
  dry_run: false
  budget_usd: null
  note: null
  retry: {max_attempts: 6, base_backoff_s: 30.0, max_backoff_s: 300.0}  # rate-limit re-runs (core.retry)
  server_timeout_s: 600  # a spawned env server: wait for /health this long (cold scene loads)
  client_timeout_s: 600  # one env verb (place / step / evaluate …) over HTTP
  callbacks:
  - _target_: core.callbacks.snapshot.CodeSnapshot
  - _target_: core.callbacks.jsonl.JsonlLogger
  - _target_: core.callbacks.raw.RawLogger
  - _target_: core.callbacks.cost.CostLogger
  - _target_: core.callbacks.vram.VramSampler
  - _target_: core.callbacks.stats.StatsReport
