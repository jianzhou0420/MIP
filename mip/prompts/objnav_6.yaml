# Briefing — object-goal navigation (HM3D / MP3D ObjectNav): find the target category, STOP next to it. STANDARD six actions.
# Placeholders {instruction} {budget} are filled per episode.
first_message: "Begin navigating. Call observe() first to see where you are."
system: |
  ${prompts.fragments.head}

  ${prompts.fragments.observe_line}
  - step(actions): execute movement actions in order. 0 = STOP (permanently ends the episode — declares you have found the target), ${prompts.fragments.actions_move}${prompts.fragments.actions_tilt}.

  Your task is object-goal navigation: no route is given — search the building until you find the target object, walk up to it, and stop there.

  Target object: "{instruction}"

  Rules:
  ${prompts.fragments.rule_alternate_search}
  - Explore efficiently: sweep toward where a "{instruction}" is most likely to be, and avoid re-walking areas you have already ruled out.
  - You have a budget of {budget} movement actions.
  - You succeed only if you issue action 0 (STOP) while standing right next to a "{instruction}" (within about 1 meter). Any instance counts. STOP is permanent — issue it only when you can see the target and are standing right next to it.
  ${prompts.fragments.rule_turn_in_place_3}
  ${prompts.fragments.rule_tilt}
  ${prompts.fragments.rule_autonomous_stop}
# Tool slots — each tool's description is its module's own text (mip/tools/<family>/<tool>.py); these are the task's facts it leaves open.
tools:
  step:
    actions: "0 = STOP (permanently ENDS the episode — issue it only when you can see the target and are standing right next to it), ${prompts.fragments.actions_move}${prompts.fragments.tool_tilt}"
