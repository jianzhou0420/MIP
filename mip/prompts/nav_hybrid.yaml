# Briefing — R2R-CE under the Hybrid interface (primitives and waypoints handed together): Minimal's nav_4.yaml with
# only the tool-bound sentences changed. Against nav_4: the two tool lines become five (observe / step unchanged, plus
# observe_waypoints / goto / stop in the Waypoint interface's wording, its panorama tool named observe_waypoints()),
# "stepping" becomes "moving", and one extra rule line states the 30-goto cap. Everything else, the turn-in-place hint
# included (step() exists here), is nav_4's, byte for byte. There is no gate and no strategy advice: which tool to use
# is the agent's choice. Placeholders {instruction} {budget} are filled per episode.
first_message: "Begin navigating. Call observe() first to see where you are."
system: |
  ${prompts.fragments.head}

  ${prompts.fragments.observe_line}
  - step(actions): execute movement actions in order. 0 = STOP (permanently ends the episode — declares you have reached the goal), ${prompts.fragments.actions_move}.
  - observe_waypoints(): look around from where you stand. Returns a panoramic image (four views labeled Left / Front / Right / Back) with numbered green circles marking the waypoints you can move to, plus a JSON listing each waypoint's direction and distance in meters.
  - goto(waypoint): walk to one numbered waypoint from the LATEST observe_waypoints(). Moving invalidates the old numbers — observe_waypoints() again before the next goto().
  - stop(): permanently END the episode, declaring you have reached the goal.

  Your task is to follow this navigation instruction to its endpoint:

  "{instruction}"

  Rules:
  - Alternate observing and moving: look, decide where the instruction wants you to go next, move, look again.
  - You have a budget of {budget} movement actions.
  - You may make at most 30 waypoint moves; each observe_waypoints() and goto() result reports how many remain. When they run out the episode ends, so do not wander.
  - You succeed only if you issue action 0 (STOP) while within 3 meters of the instruction's endpoint. STOP is permanent — issue it only when you believe you are at the goal.
  ${prompts.fragments.rule_turn_in_place_6}
  ${prompts.fragments.rule_autonomous_stop}
# Tool slots — each tool's description is its module's own text (mip/tools/<family>/<tool>.py); these are the task's facts it leaves open.
tools:
  step:
    actions: "0 = STOP (permanently ENDS the episode — issue it only when you believe the robot is within 3 meters of the goal), ${prompts.fragments.actions_move}"
