# std_mip_r2r_hybrid: R2R-CE under the Hybrid interface.
# The agent gets both action spaces at once: Minimal's observe() / step(actions) (four actions: 0 STOP,
# 1 forward 0.25 m, 2 / 3 turn left / right 15 deg) and Waypoint's look as observe_waypoints(), goto(k) and
# stop(). There is no gate: any move makes the waypoint numbers stale. Per episode: 200 model turns, 500
# simulator steps shared by step() and goto(), 30 goto calls, 2400 s. The waypoint predictor must be up at
# run.wp_server first (INSTALL.md § 6). Everything is fixed here except the seat, chosen on the command line:
#   python runner.py std_mip_r2r_hybrid harness=cc model=fable-5 [effort=max]

defaults:
  - harness: ???  # required: cc | codex | mini — mip/configs/harness/<name>.yaml
  - models: models  # the models table, mip/configs/models/models.yaml
  - api: native  # the endpoint: native (the vendor's) | fake (scripted, no model) — mip/configs/api/<name>.yaml
  - prompts/fragments@prompts.fragments: standard  # the sentences and magnitudes every briefing shares — mip/prompts/fragments/
  - prompts: nav_hybrid  # this experiment's briefing + tool descriptions — mip/prompts/nav_hybrid.yaml (nav_4 with the tool sentences swapped)
  - _self_

task_key: r2r
env_key: es
harness_key: ${harness.root}  # the chosen harness's run-name word
model: ???  # required: a row of mip/configs/models/models.yaml with an entry for the chosen harness
model_key: ${model}  # the chosen model's run-name word
effort: default  # send no effort setting: the vendor's default applies
prefix: std
suffix: ''
task:
  family: nav
  dataset: vlnce-r2r
  split: rand100          # a fixed 100-episode val-unseen sample (the Open-Nav / SmartWay subset), bundled with EmbodiedScore-envs
  episodes: 0-99          # n = 100
  n_actions: 4            # 0 STOP · 1 forward 0.25 m · 2 left 15° · 3 right 15° (no camera tilt)
  max_turns: 200          # model calls per episode; one look + one move per decision, like observe + step
  rgb_resolution: 512     # observe(): one 512×512 egocentric RGB frame, hfov 90°
  step_budget: 500        # 500 low-level simulator steps, SHARED by step() and goto() (Habitat's episode-step cap)
  episode_timeout: 2400   # seconds; the runner kills the episode 600 s after this
  require:
  - data/embodiedscore/datasets/vlnce/R2R_VLNCE_v1-3_preprocessed/rand100/rand100.json.gz
env:
  _target_: mip.envs.embodiedscore.env.EmbodiedScoreEnv
  variant: standard
  python: ac-es
  port: 9200
  env_fields:
  - rgb_resolution  # task.rgb_resolution -> configure(rgb_resolution=…) -> body.rgb height / width
  body: {}  # Body overrides on the variant's preset: forward_step_m, turn_deg, tilt_deg, camera_pitch_deg, agent_height_m, rgb: {width, height, hfov_deg, position}, depth: null …
agent:
  tools:
    _target_: mip.core.toolset.ToolSet
    word: hybrid
    use: [nav.observe, waypoint.observe_waypoints, nav.step, waypoint.goto, waypoint.stop]  # mip/tools/<family>/<tool>.py, registered in this order
    prompts: ${prompts}  # the composed prompts group: first_message · system · tools
    bare: true
    auto_observe: false     # no move returns a view: which look comes next is the agent's choice
    wp_max_moves: 30        # as on Waypoint: at most 30 goto calls, the 30th ends the episode (0 = no cap)
    wp_predict_fn: smartway_waypoint__predict
    wp_view_px: 384         # per-tile side of the returned strip, in pixels
    typed_results: true     # step() and goto() registered with dict returns (FastMCP adds structuredContent)
  harness: ${harness}
  model: ${models[${model}][${harness.root}]}
  api: ${api}
run:
  name: std_mip_r2r_${harness.root}_${model}_${effort}_hybrid
  dir: outputs/${harness.output_dir}/${run.name}
  episodes: 0-99
  servers: null
  wp_server: http://127.0.0.1:9210  # the waypoint-predictor service (INSTALL.md § 6); override per machine
  resume: false
  dry_run: false
  budget_usd: null
  note: null
  retry: {max_attempts: 6, base_backoff_s: 30.0, max_backoff_s: 300.0}  # rate-limit re-runs (mip.core.retry)
  server_timeout_s: 600  # a spawned env server: wait for /health this long (cold scene loads)
  client_timeout_s: 600  # one env verb (place / step / evaluate …) over HTTP
  callbacks:
  - _target_: mip.core.callbacks.snapshot.CodeSnapshot
  - _target_: mip.core.callbacks.jsonl.JsonlLogger
  - _target_: mip.core.callbacks.raw.RawLogger
  - _target_: mip.core.callbacks.cost.CostLogger
  - _target_: mip.core.callbacks.vram.VramSampler
  - _target_: mip.core.callbacks.stats.StatsReport
