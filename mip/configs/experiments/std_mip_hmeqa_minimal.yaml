# std_mip_hmeqa_minimal: HM-EQA (multiple-choice embodied QA) under the Minimal interface.
# The agent gets observe() (one 640x480 RGB frame, hfov 120), step(actions) with five actions (1 forward 0.25 m,
# 2 / 3 turn left / right 30 deg, 4 / 5 tilt the camera up / down 30 deg; no STOP) and answer(letter), which ends
# the episode. The body keeps HM-EQA's own rig (camera at 1.5 m, starting 30 deg down, 30 deg turns), and the
# briefing says so. Per episode: 200 model turns, 500 simulator steps, 2400 s. Everything is fixed here except
# the seat, chosen on the command line:
#   python runner.py std_mip_hmeqa_minimal harness=cc model=fable-5 [effort=max]

defaults:
  - harness: ???  # required: cc | codex | mini — mip/configs/harness/<name>.yaml
  - models: models  # the models table, mip/configs/models/models.yaml
  - api: native  # the endpoint: native (the vendor's) | fake (scripted, no model) — mip/configs/api/<name>.yaml
  - prompts/fragments@prompts.fragments: standard  # the sentences and magnitudes every briefing shares — mip/prompts/fragments/
  - prompts: eqa_6  # this experiment's briefing + tool descriptions — mip/prompts/eqa_6.yaml
  - _self_

prompts:  # the HM-EQA rig's wording — the two fragments the eqa_6 variant interpolates (mip/prompts/fragments/standard.yaml)
  fragments:
    turn_deg: 30
    camera_sentence: " Its camera starts tilted 30 degrees downward."

task_key: hmeqa
env_key: es
harness_key: ${harness.root}  # the chosen harness's run-name word
model: ???  # required: a row of mip/configs/models/models.yaml with an entry for the chosen harness
model_key: ${model}  # the chosen model's run-name word
effort: default  # send no effort setting: the vendor's default applies
prefix: std
suffix: ''
task:
  family: eqa
  dataset: hmeqa
  split: mip100           # a fixed hash-drawn 100-question sample of HM-EQA's 500, bundled with EmbodiedScore-envs; val = all 500
  episodes: 0-99          # n = 100 (all 500 questions: split=val task.episodes=0-499 run.episodes=0-499)
  max_turns: 200          # model calls per episode
  max_budget_usd: 18.0    # per-episode cost cap on the Claude SDK seat (ends the session with error_max_budget_usd)
  step_budget: 500        # 500 movement actions; when it runs out observe() / answer() still work
  episode_timeout: 2400   # seconds; the runner kills the episode 600 s after this
  tilt_actions: true      # camera tilt 4 / 5 on the step() table; with no STOP that is actions 1-5
  require:
  - thirdparty/EmbodiedScore-envs/embodiedscore_envs/splits/hmeqa/questions_mip100.json
  - data/embodiedscore/datasets/hmeqa/scene_init_poses.csv
env:
  _target_: mip.envs.embodiedscore.env.EmbodiedScoreEnv
  variant: standard
  python: ac-es
  port: 9200
  env_fields: []  # no rgb_resolution pass-through: the camera below is 640x480, not square
  body:   # HM-EQA's rig: the benchmark's own camera on the discrete action surface
    turn_deg: ${prompts.fragments.turn_deg}  # 30° turns, bound to the briefing's number; tilt stays 30° / ±60°
    camera_pitch_deg: -30.0       # the camera STARTS tilted 30° down (explore-eqa cfg/vlm_exp.yaml); tilt actions move it from there
    rgb: {width: 640, height: 480, hfov_deg: 120.0, position: [0.0, 1.5, 0.0]}   # 640×480, hfov 120, 1.5 m
agent:
  tools:
    _target_: mip.core.toolset.ToolSet
    word: minimal
    use: [nav.observe, nav.step, nav.answer]  # mip/tools/<family>/<tool>.py, registered in this order
    prompts: ${prompts}  # the composed prompts group: first_message · system · tools
    bare: true
    auto_observe: false
  harness: ${harness}
  model: ${models[${model}][${harness.root}]}
  api: ${api}
run:
  name: std_mip_hmeqa_${harness.root}_${model}_${effort}_minimal
  dir: outputs/${harness.output_dir}/${run.name}
  episodes: 0-99
  servers: null
  wp_server: null
  resume: false
  dry_run: false
  budget_usd: null
  note: null
  retry: {max_attempts: 6, base_backoff_s: 30.0, max_backoff_s: 300.0}  # rate-limit re-runs (mip.core.retry)
  server_timeout_s: 600  # a spawned env server: wait for /health this long (cold scene loads)
  client_timeout_s: 600  # one env verb (place / step / evaluate …) over HTTP
  callbacks:
  - _target_: mip.core.callbacks.snapshot.CodeSnapshot
  - _target_: mip.core.callbacks.jsonl.JsonlLogger
  - _target_: mip.core.callbacks.raw.RawLogger
  - _target_: mip.core.callbacks.cost.CostLogger
  - _target_: mip.core.callbacks.vram.VramSampler
  - _target_: mip.core.callbacks.stats.StatsReport
