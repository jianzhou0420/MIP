# std_mip_hm3d_v2_minimal: HM3D ObjectNav (v2) under the Minimal interface.
# The agent gets observe() (one 512x512 RGB frame, hfov 90) and step(actions) with six actions: 0 STOP,
# 1 forward 0.25 m, 2 / 3 turn left / right 15 deg, 4 / 5 tilt the camera up / down 30 deg. Per episode:
# 200 model turns, 500 simulator steps, 2400 s. Everything is fixed here except the seat, chosen on the command line:
#   python runner.py std_mip_hm3d_v2_minimal harness=cc model=fable-5 [effort=max]

defaults:
  - harness: ???  # required: cc | codex | mini — mip/configs/harness/<name>.yaml
  - models: models  # the models table, mip/configs/models/models.yaml
  - api: native  # the endpoint: native (the vendor's) | fake (scripted, no model) — mip/configs/api/<name>.yaml
  - prompts/fragments@prompts.fragments: standard  # the sentences and magnitudes every briefing shares — mip/prompts/fragments/
  - prompts: objnav_6  # this experiment's briefing + tool descriptions — mip/prompts/objnav_6.yaml
  - _self_

task_key: hm3d_v2
env_key: es
harness_key: ${harness.root}  # the chosen harness's run-name word
model: ???  # required: a row of mip/configs/models/models.yaml with an entry for the chosen harness
model_key: ${model}  # the chosen model's run-name word
effort: default  # the vendor's word (Claude low|medium|high|max · OpenAI low|medium|high|xhigh); default = nothing sent
prefix: std
suffix: ''
task:
  family: objnav
  dataset: objectnav-hm3d-v2
  split: mip100  # a fixed hash-drawn 100-episode sample of the 1,000 val episodes, bundled with EmbodiedScore-envs
  episodes: 0-99
  max_turns: 200  # model calls per episode
  rgb_resolution: 512
  step_budget: 500
  episode_timeout: 2400
  require:
  - thirdparty/EmbodiedScore-envs/embodiedscore_envs/splits/objectnav/hm3d/v2/mip100/mip100.json.gz
env:
  _target_: mip.envs.embodiedscore.env.EmbodiedScoreEnv
  variant: standard
  python: ac-es
  port: 9200
  env_fields:
  - rgb_resolution  # task.rgb_resolution -> configure(rgb_resolution=…) -> body.rgb height / width
  body: {}  # Body overrides on the variant's preset: forward_step_m, turn_deg, tilt_deg, camera_pitch_deg, agent_height_m, rgb: {width, height, hfov_deg, position}, depth: null …
agent:
  tools:
    _target_: mip.core.toolset.ToolSet
    word: minimal
    use: [nav.observe, nav.step]  # mip/tools/<family>/<tool>.py, registered in this order
    prompts: ${prompts}  # the composed prompts group: first_message · system · tools
    bare: true
    auto_observe: false
  harness: ${harness}
  model: ${models[${model}][${harness.root}]}
  api: ${api}
run:
  name: std_mip_hm3d_v2_${harness.root}_${model}_${effort}_minimal
  dir: outputs/${harness.output_dir}/${run.name}
  episodes: 0-99
  servers: null
  wp_server: null
  resume: false
  dry_run: false
  budget_usd: null
  note: null
  retry: {max_attempts: 6, base_backoff_s: 30.0, max_backoff_s: 300.0}  # rate-limit re-runs (mip.core.retry)
  server_timeout_s: 600  # a spawned env server: wait for /health this long (cold scene loads)
  client_timeout_s: 600  # one env verb (place / step / evaluate …) over HTTP
  callbacks:
  - _target_: mip.core.callbacks.snapshot.CodeSnapshot
  - _target_: mip.core.callbacks.jsonl.JsonlLogger
  - _target_: mip.core.callbacks.raw.RawLogger
  - _target_: mip.core.callbacks.cost.CostLogger
  - _target_: mip.core.callbacks.vram.VramSampler
  - _target_: mip.core.callbacks.stats.StatsReport
