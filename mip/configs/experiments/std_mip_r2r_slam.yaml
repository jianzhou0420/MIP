# std_mip_r2r_slam: R2R-CE under the SLAM interface.
# The agent gets Minimal's observe() / step(actions) (four actions: 0 STOP, 1 forward 0.25 m, 2 / 3 turn left /
# right 15 deg) plus six instruments over an onboard ORB-SLAM3 map: get_pose, get_map, get_trajectory,
# look_around, mark(label), preview_path. They are SLAM's estimates, never ground truth, and cost no steps.
# Each action is played as five micro-steps with every frame given to SLAM; a 360 deg scan at reset bootstraps
# the map. Per episode: 200 model turns, 500 simulator steps, 2400 s. Docker must reach the ORB-SLAM3 image (one
# container per episode). Everything is fixed here except the seat, chosen on the command line:
#   python runner.py std_mip_r2r_slam harness=cc model=fable-5 [effort=max]

defaults:
  - harness: ???  # required: cc | codex | mini — mip/configs/harness/<name>.yaml
  - models: models  # the models table, mip/configs/models/models.yaml
  - api: native  # the endpoint: native (the vendor's) | fake (scripted, no model) — mip/configs/api/<name>.yaml
  - prompts/fragments@prompts.fragments: standard  # the sentences and magnitudes every briefing shares — mip/prompts/fragments/
  - prompts: nav_slam  # this experiment's briefing + tool descriptions — mip/prompts/nav_slam.yaml (nav_4 + the six instrument lines)
  - _self_

task_key: r2r
env_key: slam_es
harness_key: ${harness.root}  # the chosen harness's run-name word
model: ???  # required: a row of mip/configs/models/models.yaml with an entry for the chosen harness
model_key: ${model}  # the chosen model's run-name word
effort: default  # send no effort setting: the vendor's default applies
prefix: std
suffix: ''
task:
  family: nav
  dataset: vlnce-r2r
  split: rand100          # a fixed 100-episode val-unseen sample (the Open-Nav / SmartWay subset), bundled with EmbodiedScore-envs
  episodes: 0-99          # n = 100
  n_actions: 4            # 0 STOP · 1 forward 0.25 m · 2 left 15° · 3 right 15° (no camera tilt)
  max_turns: 200          # model calls per episode
  rgb_resolution: 512     # observe(): one 512×512 egocentric RGB frame, hfov 90° (the SLAM stack's fine body is fixed at it)
  step_budget: 500        # 500 coarse steps (env.slam.max_coarse_steps truncates; each is 5 fed micro-steps)
  episode_timeout: 2400   # seconds; the runner kills the episode 600 s after this
  require:
  - data/embodiedscore/datasets/vlnce/R2R_VLNCE_v1-3_preprocessed/rand100/rand100.json.gz
env:
  _target_: mip.envs.embodiedscore.env.EmbodiedScoreEnv
  python: ac-es
  port: 9280
  env_fields: []  # agent.tools.instruments reaches the SlamHook's configure by itself (mip/tools/slam ENV_FIELDS)
  hooks:  # tools that must see every step run in the env server (mip/envs/embodiedscore/hook.py)
  - _target_: mip.tools.slam.hook.SlamHook  # the fed micro-stepping world + the instruments' verbs
    slam:  # the SLAM stack's knobs (mip/tools/slam/world/stack.py SLAM_KEYS), R2R values
      cell_size_m: 0.1
      map_size_m: 48.0
      max_coarse_steps: 500
      frontier_match_m: 1.5
      start_pitch_deg: 0.0
      map_mode: null  # v1 | v2 | v3; null = v2 when instruments=2, v1 otherwise
      mapper: {}  # the map class's kwargs — v2 LayeredOccupancyMap: floor_merge_m / dwell_feeds / dwell_span_m
      render: {}  # render_annotated_map_v2 kwargs: out_px / margin_m / min_window_m / grid_every_m
agent:
  tools:
    _target_: mip.core.toolset.ToolSet
    word: slam
    use: [nav.observe, nav.step, slam.get_pose, slam.get_map, slam.get_trajectory, slam.look_around, slam.mark, slam.preview_path]  # mip/tools/<family>/<tool>.py, registered in this order
    prompts: ${prompts}  # the composed prompts group: first_message · system · tools
    bare: true
    auto_observe: false     # step() returns no view: the agent calls observe() to look
    instruments: 2          # SLAM on, map v2, the six instruments served
    typed_results: true     # step() registered with dict returns (FastMCP adds structuredContent)
    legacy_dashes: true     # the slam_note writes its dash as "--" ("SLAM tracking lost -- …")
  harness: ${harness}
  model: ${models[${model}][${harness.root}]}
  api: ${api}
run:
  name: std_mip_r2r_${harness.root}_${model}_${effort}_slam
  dir: outputs/${harness.output_dir}/${run.name}
  episodes: 0-99
  servers: null
  wp_server: null
  resume: false
  dry_run: false
  budget_usd: null
  note: null
  retry: {max_attempts: 6, base_backoff_s: 30.0, max_backoff_s: 300.0}  # rate-limit re-runs (mip.core.retry)
  server_timeout_s: 600  # a spawned env server: wait for /health this long (cold scene loads)
  client_timeout_s: 600  # one env verb (place / step / evaluate …) over HTTP
  callbacks:
  - _target_: mip.core.callbacks.snapshot.CodeSnapshot
  - _target_: mip.core.callbacks.jsonl.JsonlLogger
  - _target_: mip.core.callbacks.raw.RawLogger
  - _target_: mip.core.callbacks.cost.CostLogger
  - _target_: mip.core.callbacks.vram.VramSampler
  - _target_: mip.core.callbacks.stats.StatsReport
